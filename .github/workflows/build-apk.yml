name: Build APK

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android cmdline-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME" -maxdepth 4 >&2 || true
            exit 1
          fi
          echo "Found sdkmanager at: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install required Android SDK packages
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug assembleSideload --stacktrace

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quill-notes-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/sideload/*.apk
          retention-days: 30

      - name: Publish APKs to apk-builds branch
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          SIDELOAD_APK=$(find app/build/outputs/apk/sideload -name "*.apk" | head -n 1)
          echo "Debug APK:    $DEBUG_APK ($(du -h "$DEBUG_APK" | cut -f1))"
          echo "Sideload APK: $SIDELOAD_APK ($(du -h "$SIDELOAD_APK" | cut -f1))"
          mkdir -p /tmp/apk-out
          cp "$DEBUG_APK" /tmp/apk-out/quill-notes-debug.apk
          cp "$SIDELOAD_APK" /tmp/apk-out/quill-notes-sideload.apk

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan apk-builds-tmp
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p dist
          cp /tmp/apk-out/quill-notes-debug.apk dist/quill-notes-debug.apk
          cp /tmp/apk-out/quill-notes-sideload.apk dist/quill-notes-sideload.apk
          {
            echo "Quill Notes — APKs"
            echo "Built from commit: ${GITHUB_SHA}"
            echo "Workflow run:      ${GITHUB_RUN_ID}"
            echo "Built at (UTC):    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "quill-notes-debug.apk    - full debug build (unminified)"
            echo "quill-notes-sideload.apk - debug-signed but minified/shrunk, smaller for easy install"
          } > dist/BUILD_INFO.txt
          git add dist
          git commit -m "Build APKs from ${GITHUB_SHA}"
          git push -f origin apk-builds-tmp:apk-builds
