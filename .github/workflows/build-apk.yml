name: Build APK

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android cmdline-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Found sdkmanager at: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install required Android SDK packages
        run: "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quill-notes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to apk-builds branch
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Built: $APK_PATH"
          mkdir -p /tmp/apk-out
          cp "$APK_PATH" /tmp/apk-out/quill-notes-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan apk-builds-tmp
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p dist
          cp /tmp/apk-out/quill-notes-debug.apk dist/quill-notes-debug.apk
          {
            echo "Quill Notes — debug APK"
            echo "Built from commit: ${GITHUB_SHA}"
            echo "Workflow run:      ${GITHUB_RUN_ID}"
            echo "Built at (UTC):    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD_INFO.txt
          git add dist
          git commit -m "Build APK from ${GITHUB_SHA}"
          git push -f origin apk-builds-tmp:apk-builds
